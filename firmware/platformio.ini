; PlatformIO Project Configuration File for SentryHive ESP32-S3 Edge Node
; Target: ESP32-S3-WROOM-1-N16R8 (16MB Flash, 8MB PSRAM Octal)

[platformio]
default_envs = esp32s3_sentryhive

[env:esp32s3_sentryhive]
platform = espressif32@^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.psram_type = opi

monitor_speed = 115200

build_flags = 
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3
    -D SENTRYHIVE_NODE_VERSION=\"1.0.0\"
    -D CONFIG_TINYML_USE_ESP_NN=1
    -D LORA_FREQUENCY=915.0
    -D LORA_BANDWIDTH=125.0
    -D LORA_SPREADING_FACTOR=7
    -D LORA_CODING_RATE=5
    -D LORA_TX_POWER=22

lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    jgromes/RadioLib@^6.5.0
    sensirion/Sensirion I2C SPS30@^0.3.0
    sparkfun/SparkFun MLX90640 9Hz Thermal Camera@^1.0.0
